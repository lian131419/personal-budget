<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="个人记账">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<meta name="application-name" content="个人记账">
<link rel="manifest" href="manifest.json">
<title>个人月度开销管理</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #f5f6fa; --card: #fff; --text: #1e293b; --muted: #64748b;
  --primary: #3b82f6; --danger: #ef4444; --success: #10b981; --warning: #f59e0b;
  --border: #e2e8f0; --radius: 12px; --shadow: 0 1px 3px rgba(0,0,0,.06);
  --income: #10b981; --expense: #ef4444;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
.app { max-width:1200px; margin:0 auto; padding:16px; }

/* Lock Screen */
.lock-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
.lock-card { background:var(--card); border-radius:var(--radius); box-shadow:0 4px 24px rgba(0,0,0,.08); padding:32px 24px; width:100%; max-width:400px; text-align:center; }
.lock-icon { font-size:3rem; margin-bottom:12px; }
.lock-title { font-size:1.2rem; font-weight:700; margin-bottom:4px; }
.lock-sub { font-size:.85rem; color:var(--muted); margin-bottom:24px; }
.lock-input { width:100%; padding:12px 16px; border:1.5px solid var(--border); border-radius:10px; font-size:1rem; text-align:center; letter-spacing:4px; transition:.15s; }
.lock-input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(59,130,246,.1); }
.lock-btn { margin-top:16px; width:100%; padding:12px; border-radius:10px; border:none; background:var(--primary); color:#fff; font-size:1rem; font-weight:600; cursor:pointer; }
.lock-btn:hover { opacity:.9; }
.lock-error { margin-top:8px; font-size:.82rem; color:var(--danger); }
.lock-hint { margin-top:16px; font-size:.78rem; color:var(--muted); }
.lock-hint a { color:var(--primary); cursor:pointer; text-decoration:underline; }

/* Header */
.header { display:flex; align-items:center; justify-content:space-between; padding:12px 20px; background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:16px; flex-wrap:wrap; gap:8px; }
.header h1 { font-size:1.25rem; font-weight:700; }
.header-meta { font-size:.78rem; color:var(--muted); }
.header-actions { display:flex; gap:8px; flex-wrap:wrap; }

/* Tabs */
.tabs { display:flex; gap:4px; background:var(--card); border-radius:var(--radius); padding:4px; box-shadow:var(--shadow); margin-bottom:16px; overflow-x:auto; }
.tab { flex:1 0 auto; text-align:center; padding:10px 12px; border-radius:10px; cursor:pointer; font-size:.85rem; font-weight:500; color:var(--muted); transition:.15s; border:none; background:none; white-space:nowrap; }
.tab:hover { color:var(--text); background:var(--bg); }
.tab.active { background:var(--primary); color:#fff; }

/* Cards */
.card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; margin-bottom:16px; }
.card-title { font-size:1rem; font-weight:700; margin-bottom:14px; color:var(--text); }

/* Metrics */
.metrics { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:12px; margin-bottom:16px; }
.metric { background:var(--card); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow); }
.metric-label { font-size:.78rem; color:var(--muted); margin-bottom:4px; }
.metric-value { font-size:1.3rem; font-weight:700; }
.metric-sub { font-size:.75rem; color:var(--muted); margin-top:2px; }
.metric.income .metric-value { color:var(--income); }
.metric.expense .metric-value { color:var(--expense); }

/* Table */
.table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
table { width:100%; border-collapse:collapse; font-size:.82rem; }
th { text-align:left; padding:8px 10px; background:var(--bg); font-weight:600; font-size:.78rem; color:var(--muted); border-bottom:2px solid var(--border); white-space:nowrap; }
td { padding:8px 10px; border-bottom:1px solid var(--border); }
tr:hover td { background:#f8fafc; }
.amount-pos { color:var(--income); font-weight:600; }
.amount-neg { color:var(--expense); font-weight:600; }

/* Buttons */
.btn { padding:8px 16px; border-radius:8px; border:none; font-size:.82rem; font-weight:500; cursor:pointer; transition:.15s; display:inline-flex; align-items:center; gap:6px; touch-action:manipulation; }
.btn-primary { background:var(--primary); color:#fff; }
.btn-primary:hover { opacity:.9; }
.btn-danger { background:var(--danger); color:#fff; }
.btn-outline { background:none; border:1.5px solid var(--border); color:var(--text); }
.btn-outline:hover { border-color:var(--primary); color:var(--primary); }
.btn-sm { padding:4px 10px; font-size:.75rem; border-radius:6px; }
.btn-group { display:flex; gap:8px; flex-wrap:wrap; }

/* Forms */
.form-group { margin-bottom:10px; }
.form-label { display:block; font-size:.8rem; font-weight:600; margin-bottom:4px; color:var(--muted); }
.form-input, .form-select { width:100%; padding:8px 10px; border:1.5px solid var(--border); border-radius:8px; font-size:.85rem; background:var(--card); transition:.15s; }
.form-input:focus, .form-select:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(59,130,246,.1); }
.form-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px,1fr)); gap:10px; }

/* Badge */
.badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:.72rem; font-weight:600; }
.badge-income { background:#d1fae5; color:#065f46; }
.badge-expense { background:#fee2e2; color:#991b1b; }
.badge-transfer { background:#e0e7ff; color:#3730a3; }
.badge-over { background:#fef3c7; color:#92400e; }
.badge-under { background:#d1fae5; color:#065f46; }

/* Modal */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:100; display:flex; align-items:center; justify-content:center; padding:16px; }
.modal { background:var(--card); border-radius:var(--radius); padding:24px; width:100%; max-width:480px; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.15); }
.modal-title { font-size:1.05rem; font-weight:700; margin-bottom:16px; }

/* Chart */
.chart-wrap { position:relative; width:100%; max-height:340px; }
.chart-wrap canvas { width:100% !important; }

/* Row actions */
.row-actions { display:flex; gap:6px; }
.empty { text-align:center; padding:40px 20px; color:var(--muted); font-size:.85rem; }

/* Section */
.section-title { font-size:.9rem; font-weight:700; margin:20px 0 12px; padding-bottom:8px; border-bottom:1.5px solid var(--border); }

/* Toast / notify */
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1e293b; color:#fff; padding:10px 24px; border-radius:24px; font-size:.85rem; z-index:200; opacity:0; transition:opacity .3s; pointer-events:none; }
.toast.show { opacity:1; }

/* Responsive */
@media (max-width:640px) {
  .app { padding:10px; }
  .header { padding:10px 14px; }
  .header h1 { font-size:1.1rem; }
  .card { padding:14px; }
  .metrics { grid-template-columns:1fr 1fr; }
  .metric { padding:10px 12px; }
  .metric-value { font-size:1.1rem; }
  .form-row { grid-template-columns:1fr 1fr; }
  th, td { padding:6px 8px; font-size:.75rem; }
}
@media (max-width:380px) {
  .metrics { grid-template-columns:1fr; }
  .form-row { grid-template-columns:1fr; }
}
</style>
</head>
<body>
<div id="app-root"></div>
<div class="toast" id="toast"></div>

<script>
// ====== CRYPTO LAYER (Web Crypto API, no external deps) ======
const CRYPTO = {
  ALGO: 'AES-GCM',
  KEY_ALGO: { name: 'PBKDF2' },
  ITER: 200000,
  SALT_LEN: 16,
  IV_LEN: 12,

  _encode(s) { return new TextEncoder().encode(s); },
  _decode(b) { return new TextDecoder().decode(b); },
  _ab2hex(b) { return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''); },
  _hex2ab(h) { return new Uint8Array(h.match(/.{1,2}/g).map(b=>parseInt(b,16))).buffer; },

  async _deriveKey(password, salt) {
    const base = await crypto.subtle.importKey('raw', this._encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: this.ITER, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
    );
  },

  async encrypt(plaintext, password) {
    const salt = crypto.getRandomValues(new Uint8Array(this.SALT_LEN));
    const iv = crypto.getRandomValues(new Uint8Array(this.IV_LEN));
    const key = await this._deriveKey(password, salt);
    const ct = await crypto.subtle.encrypt({ name: this.ALGO, iv }, key, this._encode(plaintext));
    return JSON.stringify({ s: this._ab2hex(salt), i: this._ab2hex(iv), c: this._ab2hex(ct) });
  },

  async decrypt(ciphertext, password) {
    try {
      const { s, i, c } = JSON.parse(ciphertext);
      const salt = new Uint8Array(this._hex2ab(s));
      const iv = new Uint8Array(this._hex2ab(i));
      const ct = new Uint8Array(this._hex2ab(c));
      const key = await this._deriveKey(password, salt);
      const pt = await crypto.subtle.decrypt({ name: this.ALGO, iv }, key, ct);
      return this._decode(pt);
    } catch(e) { return null; }
  },

  async quickHash(password) {
    // Fast hash for passcode verification only (not the encryption key)
    const data = this._encode('passcheck:' + password);
    const hash = await crypto.subtle.digest('SHA-256', data);
    return this._ab2hex(hash);
  }
};

// ====== STORAGE ======
const STORAGE_KEYS = {
  passHash: 'bp_pass_h',
  passSalt: 'bp_pass_s',
  dataEnc: 'bp_data',
  dataIv: 'bp_iv'
};

// ====== INITIAL DATA (no historical records) ======
const INITIAL_DATA = {
  categories: [
    { type:'支出', name:'餐饮', budget:2000, subs:['三餐','食材','外卖','聚餐','零食饮料'] },
    { type:'支出', name:'交通', budget:1500, subs:['公共交通','加油','停车过路','保养维修','保险'] },
    { type:'支出', name:'购物', budget:2000, subs:['线上购物','线下超市','数码','服饰','家居日用'] },
    { type:'支出', name:'居住', budget:3000, subs:['固定账单','维修更换'] },
    { type:'支出', name:'育儿', budget:1000, subs:['日常消耗','大件','教育'] },
    { type:'支出', name:'医疗', budget:500, subs:['门诊','药品','住院','生育'] },
    { type:'支出', name:'娱乐', budget:800, subs:['运动','游戏','电影','会员订阅','其他'] },
    { type:'支出', name:'人情', budget:1000, subs:['礼金','红包','礼物'] },
    { type:'支出', name:'个人护理', budget:200, subs:[] },
    { type:'支出', name:'通讯', budget:200, subs:[] },
    { type:'支出', name:'贷款', budget:0, subs:[] },
    { type:'收入', name:'工资', budget:0, subs:[] },
    { type:'收入', name:'报销款', budget:0, subs:[] },
    { type:'收入', name:'其他收入', budget:0, subs:[] },
    { type:'转账', name:'借入', budget:0, subs:[] },
    { type:'转账', name:'借出', budget:0, subs:[] },
    { type:'转账', name:'还款', budget:0, subs:[] },
    { type:'转账', name:'信用还款', budget:0, subs:[] }
  ],
  transactions: []
};

let data = JSON.parse(JSON.stringify(INITIAL_DATA));
let passcode = '';
let editId = null, trendChart = null, budgetChart = null, payMethodChart = null, incomeChart = null;
let yearlyIncomeChart = null, yearlyExpenseChart = null;

// Bill reminders storage (encrypted with data)
// Key: 'bills' array in data, if not present, default []
function getBills() {
  if (!data.bills) data.bills = [];
  return data.bills;
}

// ====== TOAST ======
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2000);
}

// ====== DATA LOAD/SAVE (encrypted) ======
function isFirstVisit() {
  const hp = localStorage.getItem(STORAGE_KEYS.passHash);
  const sp = localStorage.getItem(STORAGE_KEYS.passSalt);
  return !hp && !sp;
}

async function saveEncryptedData() {
  const json = JSON.stringify(data);
  const enc = await CRYPTO.encrypt(json, passcode);
  localStorage.setItem(STORAGE_KEYS.dataEnc, enc);
}

async function loadEncryptedData() {
  const enc = localStorage.getItem(STORAGE_KEYS.dataEnc);
  if (!enc) { data = JSON.parse(JSON.stringify(INITIAL_DATA)); return; }
  const json = await CRYPTO.decrypt(enc, passcode);
  if (json) {
    try { data = JSON.parse(json); } catch(e) { data = JSON.parse(JSON.stringify(INITIAL_DATA)); }
  } else {
    data = JSON.parse(JSON.stringify(INITIAL_DATA));
    showToast('⚠️ 数据解密失败，密码可能已更改');
  }
}

async function setPasscode(pwd) {
  const hash = await CRYPTO.quickHash(pwd);
  const salt = crypto.randomUUID();
  localStorage.setItem(STORAGE_KEYS.passHash, hash);
  localStorage.setItem(STORAGE_KEYS.passSalt, salt);
  passcode = pwd;
}

async function checkPasscode(pwd) {
  const storedHash = localStorage.getItem(STORAGE_KEYS.passHash);
  if (!storedHash) return true; // No passcode set
  const hash = await CRYPTO.quickHash(pwd);
  return hash === storedHash;
}

async function changePasscode(oldPwd, newPwd) {
  // Verify old password
  if (!(await checkPasscode(oldPwd))) return false;
  // Decrypt with old, set new passcode, re-encrypt
  const oldPass = passcode;
  passcode = oldPwd;
  await loadEncryptedData();
  passcode = newPwd;
  await setPasscode(newPwd);
  await saveEncryptedData();
  return true;
}

// ====== HELPERS ======
function fmt(n) { return Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function yyyymm(d) { const dt = new Date(d); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'); }
function monthName(m) { const [y,mn] = m.split('-'); return y+'年'+mn+'月'; }
function getCatsByType(type) { return data.categories.filter(c=>c.type===type); }
function getCatConfig(name) { return data.categories.find(c=>c.name===name); }

// ====== CATEGORY SELECTS ======
function renderCategorySelects() {
  const type = document.getElementById('txType').value;
  const cats = getCatsByType(type);
  const sel1 = document.getElementById('txCat1');
  if (!sel1) return;
  sel1.innerHTML = cats.map(c=>`<option value="${c.name}">${c.name}</option>`).join('');
  onCat1Change();
}
function onTxTypeChange() { renderCategorySelects(); }
function onCat1Change() {
  const name = document.getElementById('txCat1').value;
  const cat = getCatConfig(name);
  const sel2 = document.getElementById('txCat2');
  if (cat && cat.subs.length) {
    sel2.innerHTML = cat.subs.map(s=>`<option value="${s}">${s}</option>`).join('');
  } else { sel2.innerHTML = '<option value="">--</option>'; }
}

// ====== RENDER ======
function renderApp() {
  document.getElementById('app-root').innerHTML = `
<div class="app">
  <div class="header">
    <div>
      <h1>📊 个人月度开销管理</h1>
      <div class="header-meta">数据加密存储 · ${data.transactions.length} 条记录</div>
    </div>
    <div class="header-actions">
      <button class="btn btn-outline btn-sm" onclick="installPWA()">📲 安装到桌面</button>
      <button class="btn btn-outline btn-sm" onclick="generateSyncLink()">🔗 同步链接</button>
      <button class="btn btn-outline btn-sm" onclick="exportEncryptedData()">📤 导出备份</button>
      <button class="btn btn-outline btn-sm" onclick="showImportModal()">📥 导入备份</button>
      <button class="btn btn-outline btn-sm" onclick="showChangePassModal()">🔑 改密码</button>
      <button class="btn btn-outline btn-sm" onclick="lockApp()">🔒 锁定</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('ledger')">📝 流水账</button>
    <button class="tab" onclick="switchTab('analysis')">📈 月度分析</button>
    <button class="tab" onclick="switchTab('dashboard')">📊 可视化看板</button>
    <button class="tab" onclick="switchTab('settings')">⚙️ 参数设置</button>
  </div>
  <div id="tab-ledger">
    <div class="metrics" id="ledgerMetrics">${ledgerMetricsHTML()}</div>
    <div class="card">
      <div class="card-title">记一笔</div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">日期</label><input type="date" class="form-input" id="txDate"></div>
        <div class="form-group"><label class="form-label">类型</label><select class="form-select" id="txType" onchange="onTxTypeChange()">
          <option value="支出">支出</option><option value="收入">收入</option><option value="转账">转账</option>
        </select></div>
        <div class="form-group"><label class="form-label">一级分类</label><select class="form-select" id="txCat1" onchange="onCat1Change()"></select></div>
        <div class="form-group"><label class="form-label">二级分类</label><select class="form-select" id="txCat2"></select></div>
        <div class="form-group"><label class="form-label">金额</label><input type="number" class="form-input" id="txAmount" placeholder="0.00" step="0.01" min="0" inputmode="decimal"></div>
        <div class="form-group"><label class="form-label">支付方式</label><select class="form-select" id="txPay">
          <option value="">--</option><option>微信</option><option>支付宝</option><option>银行卡</option><option>信用卡</option><option>储蓄卡</option><option>白条</option><option>现金</option><option>其他</option>
        </select></div>
        <div class="form-group"><label class="form-label">备注</label><input type="text" class="form-input" id="txNote" placeholder="可选"></div>
      </div>
      <button class="btn btn-primary" onclick="addTransaction()">➕ 添加记录</button>
      <span style="margin-left:12px;font-size:.8rem;color:var(--muted)" id="editHint"></span>
    </div>
    <div class="card">
      <div class="card-title" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <span>交易记录</span>
        <div class="btn-group">
          <select class="form-select" style="width:auto" id="filterMonth" onchange="renderTableBody()"></select>
          <select class="form-select" style="width:auto" id="filterCat" onchange="renderTableBody()"><option value="">全部分类</option></select>
        </div>
      </div>
      <div class="table-wrap">
        <table><thead><tr><th>日期</th><th>类型</th><th>分类</th><th>二级</th><th>金额</th><th>支付</th><th>备注</th><th>操作</th></tr></thead>
        <tbody id="ledgerBody"></tbody></table>
      </div>
      <div class="empty" id="ledgerEmpty">暂无记录，开始记一笔吧</div>
    </div>
  </div>
  <div id="tab-analysis" style="display:none">
    <div class="metrics" id="analysisMetrics"></div>
    <div class="card">
      <div class="card-title">月度收支汇总</div>
      <div class="table-wrap"><table><thead><tr><th>月份</th><th>总收入</th><th>总支出</th><th>结余</th><th>预算</th><th>预算差额</th></tr></thead>
      <tbody id="analysisSummaryBody"></tbody></table></div>
    </div>
    <div class="card">
      <div class="card-title" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
        <span>分类支出矩阵</span>
        <select class="form-select" style="width:auto" id="matrixYear" onchange="renderAnalysis()"></select>
      </div>
      <div class="table-wrap" id="analysisMatrix"></div>
    </div>
    <div class="card">
      <div class="card-title">信用卡 / 信用消费汇总</div>
      <div class="table-wrap"><table><thead><tr><th>月份</th><th>信用卡</th><th>储蓄卡</th><th>微信</th><th>支付宝</th><th>白条</th><th>现金</th><th>其他</th><th>信用合计</th></tr></thead>
      <tbody id="cardSpendingBody"></tbody></table></div>
      <div style="margin-top:8px;font-size:.75rem;color:var(--muted)">信用合计 = 信用卡 + 白条，即下个月需要还款的部分</div>
    </div>
    <div class="card" id="debtCard">
      <div class="card-title">💳 负债与借贷总览</div>
      <div id="debtOverview"></div>
    </div>
  </div>
  <div id="tab-dashboard" style="display:none">
    <div class="card">
      <div class="card-title" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
        <span>月度收支趋势</span>
        <select class="form-select" style="width:auto" id="dashYear" onchange="renderDashboard()"></select>
      </div>
      <div class="chart-wrap" style="max-height:320px"><canvas id="trendChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title">分类预算执行率</div>
      <div class="chart-wrap" style="max-height:380px"><canvas id="budgetChart"></canvas></div>

// ====== LOCK SCREEN ======
function renderLockScreen() {
  document.getElementById('app-root').innerHTML = `
<div class="lock-screen">
  <div class="lock-card">
    <div class="lock-icon">🔐</div>
    <div class="lock-title" id="lockTitle">个人月度开销管理</div>
    <div class="lock-sub" id="lockSub">输入密码进入</div>
    <input type="password" class="lock-input" id="lockPass" placeholder="••••••" maxlength="32" autocomplete="off">
    <button class="lock-btn" id="lockBtn">进入</button>
    <div class="lock-error" id="lockError"></div>
    <div class="lock-hint" id="lockHint"></div>
  </div>
</div>`;

  const title = document.getElementById('lockTitle');
  const sub = document.getElementById('lockSub');
  const hint = document.getElementById('lockHint');
  const btn = document.getElementById('lockBtn');
  const input = document.getElementById('lockPass');
  const err = document.getElementById('lockError');

  if (isFirstVisit()) {
    title.textContent = '🔐 首次设置密码';
    sub.textContent = '请设置一个密码来保护你的账本数据';
    btn.textContent = '设置密码并进入';
    hint.innerHTML = '密码用于加密存储数据，请牢记。忘记密码则数据无法恢复。';
  }

  async function doLogin() {
    const pwd = input.value.trim();
    if (!pwd || pwd.length < 4) { err.textContent = '密码至少4位'; return; }
    if (isFirstVisit()) {
      await setPasscode(pwd);
      data = JSON.parse(JSON.stringify(INITIAL_DATA));
      await saveEncryptedData();
      renderApp();
    } else {
      const ok = await checkPasscode(pwd);
      if (!ok) { err.textContent = '密码错误'; return; }
      passcode = pwd;
      await loadEncryptedData();
      renderApp();
    }
  }

  btn.addEventListener('click', doLogin);
  input.addEventListener('keypress', e=>{ if (e.key==='Enter') doLogin(); });
  input.focus();
}

// ====== LOCK / LOGOUT ======
function lockApp() {
  passcode = '';
  data = JSON.parse(JSON.stringify(INITIAL_DATA));
  document.querySelectorAll('.modal-overlay').forEach(m=>m.style.display='none');
  renderLockScreen();
}

async function safeSave() { await saveEncryptedData(); document.querySelector('.header-meta').textContent = '数据加密存储 · '+data.transactions.length+' 条记录'; }

// ====== TAB SWITCHING ======
function switchTab(tab) {
  const tabs = ['ledger','analysis','dashboard','settings'];
  document.querySelectorAll('.tab').forEach((t,i)=>{ t.classList.toggle('active', tabs[i]===tab); });
  tabs.forEach(t=>{ const el = document.getElementById('tab-'+t); if (el) el.style.display = t===tab?'block':'none'; });
  if (tab==='ledger') { renderCategorySelects(); renderLedger(); }
  if (tab==='analysis') renderAnalysis();
  if (tab==='dashboard') renderDashboard();
  if (tab==='settings') renderSettings();
}

// ====== TRANSACTIONS ======
let editingId = null;
async function addTransaction() {
  const date = document.getElementById('txDate').value;
  const type = document.getElementById('txType').value;
  const cat1 = document.getElementById('txCat1').value;
  const cat2 = document.getElementById('txCat2').value;
  const amount = parseFloat(document.getElementById('txAmount').value);
  const pay = document.getElementById('txPay').value;
  const note = document.getElementById('txNote').value;
  if (!date || !cat1 || isNaN(amount) || amount<=0) { showToast('请填写日期、分类和金额'); return; }

  const tx = { id:Date.now(), date, type, cat1, cat2:cat2||'', amount, pay, note };
  if (editingId) {
    const idx = data.transactions.findIndex(t=>t.id===editingId);
    if (idx>=0) { tx.id = editingId; data.transactions[idx] = tx; }
    editingId = null;
    document.getElementById('editHint').textContent = '';
  } else {
    data.transactions.push(tx);
  }
  await safeSave();
  clearTxForm();
  renderLedger();
}
function clearTxForm() {
  document.getElementById('txAmount').value = '';
  document.getElementById('txNote').value = '';
  document.getElementById('txPay').value = '';
  editingId = null;
  document.getElementById('editHint').textContent = '';
}
function editTx(id) {
  const tx = data.transactions.find(t=>t.id===id);
  if (!tx) return;
  editingId = id;
  document.getElementById('txDate').value = tx.date;
  document.getElementById('txType').value = tx.type;
  renderCategorySelects();
  setTimeout(()=>{
    document.getElementById('txCat1').value = tx.cat1;
    onCat1Change();
    setTimeout(()=>{ document.getElementById('txCat2').value = tx.cat2||''; },30);
  },30);
  document.getElementById('txAmount').value = tx.amount;
  document.getElementById('txPay').value = tx.pay||'';
  document.getElementById('txNote').value = tx.note||'';
  document.getElementById('editHint').textContent = '✏️ 正在编辑，修改后点"添加记录"保存';
  switchTab('ledger');
}
async function deleteTx(id) {
  if (!confirm('确认删除这条记录？')) return;
  data.transactions = data.transactions.filter(t=>t.id!==id);
  await safeSave();
  renderLedger();
}

// ====== RENDER LEDGER ======
function ledgerMetricsHTML() {
  const totalIn = data.transactions.filter(t=>t.type==='收入').reduce((s,t)=>s+t.amount,0);
  const totalOut = data.transactions.filter(t=>t.type==='支出').reduce((s,t)=>s+t.amount,0);
  return `
    <div class="metric income"><div class="metric-label">累计收入</div><div class="metric-value">¥${fmt(totalIn)}</div></div>
    <div class="metric expense"><div class="metric-label">累计支出</div><div class="metric-value">¥${fmt(totalOut)}</div></div>
    <div class="metric"><div class="metric-label">累计结余</div><div class="metric-value" style="color:${totalIn-totalOut>=0?'var(--success)':'var(--danger)'}">¥${fmt(totalIn-totalOut)}</div></div>
    <div class="metric"><div class="metric-label">总记录数</div><div class="metric-value">${data.transactions.length}</div></div>`;
}

function renderLedger() {
  const months = [...new Set(data.transactions.map(t=>yyyymm(t.date)))].sort().reverse();
  const sel = document.getElementById('filterMonth');
  const curVal = sel.value;
  sel.innerHTML = '<option value="">全部月份</option>'+months.map(m=>`<option value="${m}">${monthName(m)}</option>`).join('');
  if (months.includes(curVal)) sel.value = curVal;

  const catSel = document.getElementById('filterCat');
  const catVal = catSel.value;
  const expCats = getCatsByType('支出').map(c=>c.name);
  catSel.innerHTML = '<option value="">全部分类</option>'+expCats.map(c=>`<option value="${c}">${c}</option>`).join('');
  if (expCats.includes(catVal)) catSel.value = catVal;

  renderTableBody();
}

function renderTableBody() {
  const filterM = document.getElementById('filterMonth')?.value || '';
  const filterC = document.getElementById('filterCat')?.value || '';
  let txs = [...data.transactions].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  if (filterM) txs = txs.filter(t=>yyyymm(t.date)===filterM);
  if (filterC) txs = txs.filter(t=>t.cat1===filterC);

  const tbody = document.getElementById('ledgerBody');
  const empty = document.getElementById('ledgerEmpty');
  if (!tbody) return;
  if (txs.length===0) { tbody.innerHTML=''; if(empty)empty.style.display='block'; }
  else {
    if(empty)empty.style.display='none';
    tbody.innerHTML = txs.map(t=>{
      const cls = t.type==='收入'?'amount-pos':(t.type==='支出'?'amount-neg':'');
      const badge = t.type==='收入'?'badge-income':(t.type==='支出'?'badge-expense':'badge-transfer');
      return `<tr><td>${t.date}</td><td><span class="badge ${badge}">${t.type}</span></td><td>${t.cat1}</td><td>${t.cat2||'--'}</td><td class="${cls}">¥${fmt(t.amount)}</td><td>${t.pay||'--'}</td><td>${t.note||'--'}</td><td><div class="row-actions"><button class="btn btn-outline btn-sm" onclick="editTx(${t.id})">✏️</button><button class="btn btn-danger btn-sm" onclick="deleteTx(${t.id})">🗑️</button></div></td></tr>`;
    }).join('');
  }
}

// ====== RENDER ANALYSIS ======
function renderAnalysis() {
  const monthsSet = new Set(); data.transactions.forEach(t=>monthsSet.add(yyyymm(t.date)));
  const months = [...monthsSet].sort();
  const years = [...new Set(months.map(m=>m.split('-')[0]))].sort();
  const yearSel = document.getElementById('matrixYear');
  const curYear = yearSel?.value || years[years.length-1] || new Date().getFullYear().toString();
  yearSel && (yearSel.innerHTML = years.map(y=>`<option value="${y}" ${y===curYear?'selected':''}>${y}年</option>`).join(''));
  const filterYear = yearSel?.value || years[years.length-1] || new Date().getFullYear().toString();
  const yearMonths = months.filter(m=>m.startsWith(filterYear));
  const expenseCats = getCatsByType('支出').map(c=>c.name);
  const totalBudget = getCatsByType('支出').reduce((s,c)=>s+c.budget,0);

  // Summary table
  const sBody = document.getElementById('analysisSummaryBody');
  if (sBody) {
    sBody.innerHTML = months.map(m=>{
      const mTxs = data.transactions.filter(t=>yyyymm(t.date)===m);
      const inc = mTxs.filter(t=>t.type==='收入').reduce((s,t)=>s+t.amount,0);
      const exp = mTxs.filter(t=>t.type==='支出').reduce((s,t)=>s+t.amount,0);
      const bal = inc-exp;
      const diff = exp-totalBudget;
      return `<tr><td><strong>${monthName(m)}</strong></td><td class="amount-pos">¥${fmt(inc)}</td><td class="amount-neg">¥${fmt(exp)}</td><td style="color:${bal>=0?'var(--success)':'var(--danger)'};font-weight:600">¥${fmt(bal)}</td><td>¥${fmt(totalBudget)}</td><td class="${diff>0?'amount-neg':'amount-pos'}">${diff>0?'+':''}¥${fmt(diff)}</td></tr>`;
    }).join('');
    const totalIn = data.transactions.filter(t=>t.type==='收入').reduce((s,t)=>s+t.amount,0);
    const totalOut = data.transactions.filter(t=>t.type==='支出').reduce((s,t)=>s+t.amount,0);
    sBody.innerHTML += `<tr style="font-weight:700;background:var(--bg)"><td>合计</td><td class="amount-pos">¥${fmt(totalIn)}</td><td class="amount-neg">¥${fmt(totalOut)}</td><td style="color:${totalIn-totalOut>=0?'var(--success)':'var(--danger)'}">¥${fmt(totalIn-totalOut)}</td><td>¥${fmt(totalBudget*months.length)}</td><td></td></tr>`;
  }

  // Matrix
  const matrixDiv = document.getElementById('analysisMatrix');
  if (matrixDiv) {
    if (yearMonths.length===0) {
      matrixDiv.innerHTML = '<div class="empty">该年份暂无数据</div>';
    } else {
      let html = '<div class="table-wrap"><table><thead><tr><th>月份</th>';
      expenseCats.forEach(c=>html+=`<th>${c}</th>`); html+='<th>合计</th></tr></thead><tbody>';
      yearMonths.forEach(m=>{
        const mTxs = data.transactions.filter(t=>yyyymm(t.date)===m);
        html+=`<tr><td>${monthName(m)}</td>`; let rs=0;
        expenseCats.forEach(c=>{
          const amt = mTxs.filter(t=>t.type==='支出'&&t.cat1===c).reduce((s,t)=>s+t.amount,0);
          rs+=amt; const cat=getCatConfig(c);
          const over=cat&&cat.budget>0&&amt>cat.budget;
          html+=`<td style="color:${over?'var(--danger)':''};font-weight:${over?600:400}">${amt>0?'¥'+fmt(amt):'--'}</td>`;
        });
        html+=`<td style="font-weight:600">¥${fmt(rs)}</td></tr>`;
      });
      html+='</tbody></table></div>'; matrixDiv.innerHTML=html;
    }
  }

  // Metrics
  const aMet = document.getElementById('analysisMetrics');
  if (aMet) {
    const lm = months[months.length-1];
    const lTxs = lm ? data.transactions.filter(t=>yyyymm(t.date)===lm) : [];
    const li = lTxs.filter(t=>t.type==='收入').reduce((s,t)=>s+t.amount,0);
    const lo = lTxs.filter(t=>t.type==='支出').reduce((s,t)=>s+t.amount,0);
    aMet.innerHTML = `
      <div class="metric income"><div class="metric-label">${lm?monthName(lm):'无数据'} 收入</div><div class="metric-value">¥${fmt(li)}</div></div>
      <div class="metric expense"><div class="metric-label">${lm?monthName(lm):'无数据'} 支出</div><div class="metric-value">¥${fmt(lo)}</div></div>
      <div class="metric"><div class="metric-label">当月结余</div><div class="metric-value" style="color:${li-lo>=0?'var(--success)':'var(--danger)'}">¥${fmt(li-lo)}</div></div>
      <div class="metric"><div class="metric-label">月预算</div><div class="metric-value">¥${fmt(totalBudget)}</div><div class="metric-sub">${lo>totalBudget?'⚠️ 超预算'+(lo-totalBudget).toFixed(2)+'元':'✅ 预算内'}</div></div>`;
  }

  // Card spending table
  renderCardSpending(months);
  renderDebtOverview('debtOverview');
}

// ====== RENDER DASHBOARD ======
function renderDashboard() {
  const monthsSet = new Set(); data.transactions.forEach(t=>monthsSet.add(yyyymm(t.date)));
  const months = [...monthsSet].sort();
  if (months.length===0) {
    document.getElementById('budgetExecBody') && (document.getElementById('budgetExecBody').innerHTML='<tr><td colspan="5" class="empty">暂无数据</td></tr>');
    return;
  }
  const years = [...new Set(months.map(m=>m.split('-')[0]))].sort();
  const dashYear = document.getElementById('dashYear');
  const curY = dashYear?.value || years[years.length-1] || '';
  dashYear && (dashYear.innerHTML = years.map(y=>`<option value="${y}" ${y===curY?'selected':''}>${y}年</option>`).join(''));
  const filterY = dashYear?.value || years[years.length-1] || new Date().getFullYear().toString();
  const yearMonths = months.filter(m=>m.startsWith(filterY));
  const totalBudget = getCatsByType('支出').reduce((s,c)=>s+c.budget,0);

  // Trend chart
  const ctx1 = document.getElementById('trendChart')?.getContext('2d');
  if (ctx1) {
    if (trendChart) trendChart.destroy();
    trendChart = new Chart(ctx1, {
      type:'bar',
      data:{
        labels: yearMonths.map(m=>m.split('-')[1]+'月'),
        datasets:[
          { label:'收入', data:yearMonths.map(m=>data.transactions.filter(t=>yyyymm(t.date)===m&&t.type==='收入').reduce((s,t)=>s+t.amount,0)), backgroundColor:'rgba(16,185,129,.6)', borderColor:'#10b981', borderWidth:1 },
          { label:'支出', data:yearMonths.map(m=>data.transactions.filter(t=>yyyymm(t.date)===m&&t.type==='支出').reduce((s,t)=>s+t.amount,0)), backgroundColor:'rgba(239,68,68,.6)', borderColor:'#ef4444', borderWidth:1 },
          { label:'预算线', data:yearMonths.map(()=>totalBudget), type:'line', borderColor:'#f59e0b', borderWidth:2, pointRadius:0, fill:false, tension:.3 }
        ]
      },

    });
  }

  // Budget chart
  const expenseCats = getCatsByType('支出');
  const catSpent = expenseCats.map(c=>data.transactions.filter(t=>t.type==='支出'&&t.cat1===c.name).reduce((s,t)=>s+t.amount,0));
  const catBudgets = expenseCats.map(c=>c.budget*months.length);

  if (ctx2) {

      type:'bar',

        ]
      },
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:true, plugins:{ legend:{ position:'bottom', labels:{ boxWidth:12, font:{size:11} } }, tooltip:{ callbacks:{ label:ctx=>ctx.dataset.label+': ¥'+fmt(ctx.raw) } } }, scales:{ x:{ ticks:{ callback:v=>'¥'+(v/10000).toFixed(1)+'万' } } } }
    });
  }

  // Budget exec table
  const execBody = document.getElementById('budgetExecBody');
  if (execBody) {
    execBody.innerHTML = expenseCats.map((c,i)=>{
      const bud = c.budget*months.length;
      const rate = bud>0?catSpent[i]/bud:0;
      const ratePct = (rate*100).toFixed(1)+'%';
      let sb = bud===0?'<span class="badge" style="background:#e2e8f0;color:#64748b">无预算</span>': rate>1?'<span class="badge badge-over">超支</span>':rate>0.8?'<span class="badge badge-over">⚠️ 接近上限</span>':'<span class="badge badge-under">正常</span>';
      return `<tr><td><strong>${c.name}</strong></td><td class="amount-neg">¥${fmt(catSpent[i])}</td><td>¥${fmt(bud)}</td><td style="font-weight:600;color:${rate>1?'var(--danger)':rate>0.8?'var(--warning)':'var(--success)'}">${ratePct}</td><td>${sb}</td></tr>`;
    }).join('');
  }

  // Pay method pie chart for this month
  renderPayMethodChart(months, yearMonths);
  renderDebtOverview('debtDashboard');
}

// ====== SHARED HELPERS: Card Spending, Debt, Pay Method ======
const PAY_METHODS = ['信用卡','储蓄卡','微信','支付宝','白条','现金'];
const CREDIT_METHODS = ['信用卡','白条'];

function renderCardSpending(months) {
  const body = document.getElementById('cardSpendingBody');
  if (!body) return;
  // Pay method keys from actual data + built-in list
  const allMethods = new Set(PAY_METHODS);
  data.transactions.filter(t=>t.type==='支出').forEach(t=>{ if(t.pay) allMethods.add(t.pay); });
  const methodList = [...allMethods];
  // Move credit methods to front
  methodList.sort((a,b)=>{
    const aIsC = CREDIT_METHODS.includes(a), bIsC = CREDIT_METHODS.includes(b);
    if(aIsC && !bIsC) return -1; if(!aIsC && bIsC) return 1; return a.localeCompare(b);
  });

  body.innerHTML = months.map(m=>{
    const mExpTxs = data.transactions.filter(t=>yyyymm(t.date)===m && t.type==='支出');
    let cells = ''; let creditTotal = 0;
    methodList.forEach(method=>{
      const amt = mExpTxs.filter(t=>t.pay===method).reduce((s,t)=>s+t.amount,0);
      cells += `<td>${amt>0?'¥'+fmt(amt):'--'}</td>`;
      if(CREDIT_METHODS.includes(method)) creditTotal += amt;
    });
    return `<tr><td><strong>${monthName(m)}</strong></td>${cells}<td style="font-weight:700;color:var(--danger)">¥${fmt(creditTotal)}</td></tr>`;
  }).join('');

  // Rebuild header
  const tbl = body.closest('.card').querySelector('thead tr');
  if (tbl) {
    tbl.innerHTML = '<th>月份</th>'+methodList.map(m=>`<th>${m}</th>`).join('')+'<th>信用合计</th>';
  }
}

function renderDebtOverview(containerId) {
  const el = document.getElementById(containerId);

  const borrowIn = data.transactions.filter(t=>t.cat1==='借入').reduce((s,t)=>s+t.amount,0);
  const borrowOut = data.transactions.filter(t=>t.cat1==='借出').reduce((s,t)=>s+t.amount,0);
  const repay = data.transactions.filter(t=>t.cat1==='还款').reduce((s,t)=>s+t.amount,0);
  const creditRepay = data.transactions.filter(t=>t.cat1==='信用还款').reduce((s,t)=>s+t.amount,0);

  // Net debt: money we owe vs owed to us
  const netBorrow = borrowIn - repay; // we still owe others
  const netLend = borrowOut; // others owe us (no repayment mechanic yet)

  el.innerHTML = `
<div class="metrics">

    <div class="metric-sub">全部历史信用卡 + 白条</div>
  </div>
  <div class="metric" style="${netBorrow>0?'border:2px solid var(--danger);':''}">
    <div class="metric-label">📥 借入待还</div>
    <div class="metric-value" style="color:${netBorrow>0?'var(--danger)':'var(--success)'}">¥${fmt(netBorrow)}</div>
    <div class="metric-sub">借入¥${fmt(borrowIn)} - 已还¥${fmt(repay)}</div>
  </div>
  <div class="metric" style="${netLend>0?'border:2px solid var(--warning);':''}">
    <div class="metric-label">📤 借出待收回</div>
    <div class="metric-value" style="color:${netLend>0?'var(--warning)':'var(--muted)'}">¥${fmt(netLend)}</div>
    <div class="metric-sub">${netLend>0?'他人还欠你 ¥'+fmt(netLend):'无外借'}</div>
  </div>
</div>
<div style="margin-top:8px;display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;">
  <div style="flex:1;min-width:160px;background:${creditSpent-netBorrow>0?'#fef3c7':''};padding:10px;border-radius:8px;border:1px solid var(--border)">
    <span style="color:var(--muted)">下月待还款：</span>
    <span style="font-weight:700;color:var(--danger);font-size:1.05rem">¥${fmt(creditSpent + netBorrow)}</span>
    <div style="font-size:.72rem;color:var(--muted)">信用卡/白条 ¥${fmt(creditSpent)} + 借入待还 ¥${fmt(netBorrow)}</div>
  </div>

    <div style="font-size:.72rem;color:var(--muted)">通过转账→信用还款记录</div>
  </div>
</div>`;
}

function creditSpentByMonth() {
  const thisM = yyyymm(new Date());
  return data.transactions
    .filter(t=>t.type==='支出' && CREDIT_METHODS.includes(t.pay) && yyyymm(t.date)===thisM)
    .reduce((s,t)=>s+t.amount, 0);
}

function renderPayMethodChart(months, yearMonths) {
  const ctx = document.getElementById('payMethodChart')?.getContext('2d');
  if (!ctx) return;

  // Use the latest month (or filter) for pie
  const targetMonth = yearMonths.length>0 ? yearMonths[yearMonths.length-1] : (months.length>0?months[months.length-1]:null);
  const mTxs = targetMonth ? data.transactions.filter(t=>yyyymm(t.date)===targetMonth && t.type==='支出') : [];

  // Group by payment method
  const payGroups = {};
  mTxs.forEach(t=>{ const k = t.pay||'其他'; payGroups[k] = (payGroups[k]||0)+t.amount; });
  const labels = Object.keys(payGroups).sort((a,b)=>payGroups[b]-payGroups[a]);
  const values = labels.map(l=>payGroups[l]);

  if (payMethodChart) payMethodChart.destroy();
  payMethodChart = new Chart(ctx, {
    type:'doughnut',
    data:{
      labels,
      datasets:[{ data:values, backgroundColor:['#ef4444','#3b82f6','#10b981','#f59e0b','#8b5cf6','#ec4899','#64748b'], borderWidth:0 }]
    },
    options:{
      responsive:true, maintainAspectRatio:true,
      plugins:{
        legend:{ position:'bottom', labels:{ padding:12, font:{size:11} } },
        tooltip:{ callbacks:{ label:ctx=>ctx.label+': ¥'+fmt(ctx.raw) } }

}

function showImportModal() { document.getElementById('importModal').style.display='flex'; }
function closeImportModal() { document.getElementById('importModal').style.display='none'; }
async function doImport() {
  const file = document.getElementById('importFile')?.files?.[0];
  const pwd = document.getElementById('importPass')?.value?.trim();
  if (!file || !pwd) { showToast('请选择文件并输入密码'); return; }
  const reader = new FileReader();
  reader.onload = async ev=>{
    let json;
    try {
      const dec = await CRYPTO.decrypt(ev.target.result, pwd);
      if (!dec) { showToast('❌ 密码错误或文件格式不正确'); return; }
      json = JSON.parse(dec);
      if (!json.categories || !json.transactions) throw new Error('invalid');
    } catch(e) { showToast('❌ 解密失败，请检查密码和文件'); return; }
    if (!confirm(`即将导入 ${json.transactions.length} 条记录，合并到当前数据中。确认？`)) return;
    // Merge: add new transactions
    const existingIds = new Set(data.transactions.map(t=>t.id));
    let added = 0;
    for (const tx of json.transactions) {
      if (!existingIds.has(tx.id)) { data.transactions.push(tx); existingIds.add(tx.id); added++; }
    }
    // Merge categories
    for (const cat of json.categories) {
      if (!data.categories.some(c=>c.type===cat.type&&c.name===cat.name)) {
        data.categories.push(cat);
      }
    }
    await safeSave(); closeImportModal(); renderApp();
    showToast(`✅ 导入了 ${added} 条新记录`);
  };
  reader.readAsText(file);
}

// ====== SYNC LINK (cross-device manual sync via URL hash) ======
async function generateSyncLink() {
  if (data.transactions.length === 0) { showToast('暂无数据可同步'); return; }
  const enc = await CRYPTO.encrypt(JSON.stringify(data), passcode);
  // Compress by using btoa to encode the JSON string
  const b64 = btoa(enc);
  const url = new URL(window.location.href);
  url.hash = 'sync=' + b64;
  
  try {
    await navigator.clipboard.writeText(url.href);
    showToast('✅ 同步链接已复制到剪贴板，发送到另一台设备打开即可');
  } catch(e) {
    // Fallback: show a modal with the link for manual copy
    const oldHtml = document.getElementById('app-root').innerHTML;
    document.getElementById('app-root').innerHTML = `
<div class="modal-overlay" style="display:flex" onclick="document.getElementById('syncLinkModal').remove()">
<div class="modal" id="syncLinkModal" onclick="event.stopPropagation()">
<div class="modal-title">🔗 同步链接已生成</div>
<div style="font-size:.82rem;color:var(--muted);margin-bottom:12px;">复制以下链接，发送到另一台设备。在另一台设备打开链接后输入密码即可恢复全部数据。</div>
<textarea readonly style="width:100%;height:80px;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:.75rem;word-break:break-all;resize:vertical;">${url.href}</textarea>
<div style="margin-top:12px;font-size:.75rem;color:var(--danger)">🔐 链接本身是加密的，没有密码无法读取。</div>
<button class="btn btn-primary" style="margin-top:12px;width:100%" onclick="document.getElementById('syncLinkModal').remove()">关闭</button>
</div></div>`;
  }
}

function checkSyncLink() {
  const hash = window.location.hash;
  if (!hash || !hash.startsWith('#sync=')) return null;
  const b64 = hash.slice(6);
  try { return atob(b64); } catch(e) { return null; }
}

async function applySyncLink(encryptedStr) {
  if (!passcode) { showToast('请先解锁后再同步'); return; }
  const json = await CRYPTO.decrypt(encryptedStr, passcode);
  if (!json) { showToast('❌ 密码不匹配。链接可能属于另一个密码保护的账本。'); return; }
  try {
    const imported = JSON.parse(json);
    if (!imported.categories || !imported.transactions) throw new Error('invalid');
    const existingIds = new Set(data.transactions.map(t=>t.id));
    let added = 0;
    for (const tx of imported.transactions) {
      if (!existingIds.has(tx.id)) { data.transactions.push(tx); existingIds.add(tx.id); added++; }
    }
    for (const cat of imported.categories) {
      if (!data.categories.some(c=>c.type===cat.type&&c.name===cat.name)) { data.categories.push(cat); }
    }
    await safeSave();
    // Clean URL hash
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, '', window.location.pathname + window.location.search);
    }
    renderApp();
    showToast(`✅ 同步完成，导入了 ${added} 条新记录`);
  } catch(e) { showToast('❌ 数据格式错误'); }
}

// ====== INIT ======
async function init() {
  // Check for sync link in URL hash
  const syncData = checkSyncLink();
  if (syncData) {
    if (isFirstVisit()) {
      // Show lock screen first, then auto-sync after login
      renderLockScreen();
      // Override the lock screen behavior to auto-sync after unlock
      const origBtn = document.getElementById('lockBtn');
      if (origBtn) {
        const origHandler = origBtn.onclick;
        origBtn.addEventListener('click', async function syncAfterUnlock() {
          // Wait a bit for the login to complete... 
          setTimeout(async () => {
            if (passcode) {
              await applySyncLink(syncData);
            }
          }, 500);
        }, { once: false });
      }
      return;
    } else {
      renderLockScreen();
      // After unlock, auto-sync
      const origBtn = document.getElementById('lockBtn');
      if (origBtn) {
        origBtn.addEventListener('click', async function syncAfterUnlock() {
          setTimeout(async () => {
            if (passcode) {
              await applySyncLink(syncData);
            }
          }, 500);
        }, { once: false });
      }
      return;
    }
  }

  if (isFirstVisit()) {
    renderLockScreen();
  } else {
    // Check if there's encrypted data
    const enc = localStorage.getItem(STORAGE_KEYS.dataEnc);
    if (!enc) {
      // Has passcode but no data (fresh after setup)
      data = JSON.parse(JSON.stringify(INITIAL_DATA));
      renderApp();
      return;
    }
    renderLockScreen();
  }
}

// ====== EXPORT EXCEL (XLSX) ======
function exportExcel() {
  // Build CSV with BOM for Excel compatibility
  const rows = [['日期','类型','一级分类','二级分类','金额','支付方式','备注']];
  const sorted = [...data.transactions].sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
  sorted.forEach(t=>rows.push([t.date,t.type,t.cat1,t.cat2,t.amount,t.pay,t.note]));
  // Add monthly summary on a second "sheet" conceptually
  rows.push([]);
  rows.push(['=== 月度收支汇总 ===']);
  rows.push(['月份','总收入','总支出','结余']);
  const monthsSet = new Set(); data.transactions.forEach(t=>monthsSet.add(yyyymm(t.date)));
  [...monthsSet].sort().forEach(m=>{
    const mTxs = data.transactions.filter(t=>yyyymm(t.date)===m);
    const inc = mTxs.filter(t=>t.type==='收入').reduce((s,t)=>s+t.amount,0);
    const exp = mTxs.filter(t=>t.type==='支出').reduce((s,t)=>s+t.amount,0);
    rows.push([monthName(m),inc,exp,inc-exp]);
  });
  const csv = '\uFEFF' + rows.map(r=>r.map(c=>{
    if (typeof c==='string' && (c.includes(',')||c.includes('"')||c.includes('\n'))) return '"'+c.replace(/"/g,'""')+'"';
    return c;
  }).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '个人账本导出_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click(); URL.revokeObjectURL(a.href);
  showToast('✅ CSV已下载，可用Excel打开');
}

  const now = new Date();
  const thisM = yyyymm(now);
  const mTxs = data.transactions.filter(t=>yyyymm(t.date)===thisM);
  const spent = mTxs.filter(t=>t.type==='支出').reduce((s,t)=>s+t.amount,0);
  const income = mTxs.filter(t=>t.type==='收入').reduce((s,t)=>s+t.amount,0);
  const totalBudget = getCatsByType('支出').reduce((s,c)=>s+c.budget,0);

  // Days remaining
  const lastDay = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const today = now.getDate();
  const remaining = lastDay - today + 1;
  const dailyLeft = remaining > 0 ? Math.max(0, (totalBudget - spent) / remaining) : 0;
  const avgDaily = today > 0 ? spent / today : 0;

  // Savings rate
  const savingsRate = income > 0 ? ((income - spent) / income * 100) : 0;

  // YoY comparison
  const lastYearM = (now.getFullYear()-1) + '-' + String(now.getMonth()+1).padStart(2,'0');
  const lyTxs = data.transactions.filter(t=>yyyymm(t.date)===lastYearM);
  const lySpent = lyTxs.filter(t=>t.type==='支出').reduce((s,t)=>s+t.amount,0);
  const yoyDiff = lySpent > 0 ? ((spent - lySpent) / lySpent * 100) : null;

  el.innerHTML = `
<div class="metrics">
  <div class="metric" style="${spent>totalBudget?'border:2px solid var(--danger);':''}">
    <div class="metric-label">本月已花 / 预算</div>
    <div class="metric-value" style="color:${spent>totalBudget?'var(--danger)':'var(--text)'}">¥${fmt(spent)} / ¥${fmt(totalBudget)}</div>
    <div class="metric-sub">${spent>totalBudget?'⚠️ 已超预算 ¥'+fmt(spent-totalBudget):'剩余 ¥'+fmt(totalBudget-spent)}</div>
  </div>
  <div class="metric">
    <div class="metric-label">剩余天数 / 日均可用</div>
    <div class="metric-value">${remaining} 天 / ¥${fmt(dailyLeft)}/天</div>
    <div class="metric-sub">当前日均消费 ¥${fmt(avgDaily)}/天</div>
  </div>
  <div class="metric" style="${savingsRate<0?'border:2px solid var(--danger);':savingsRate>=30?'border:2px solid var(--success);':''}">
    <div class="metric-label">💎 储蓄率</div>
    <div class="metric-value" style="color:${savingsRate>=30?'var(--success)':savingsRate>=0?'var(--text)':'var(--danger)'}">${savingsRate.toFixed(1)}%</div>
    <div class="metric-sub">${savingsRate>=30?'🎉 超过30%目标':savingsRate>=0?'距30%目标差'+(30-savingsRate).toFixed(1)+'%':'⚠️ 入不敷出'}</div>
  </div>
  <div class="metric">
    <div class="metric-label">📅 同比（去年${now.getMonth()+1}月）</div>
    <div class="metric-value" style="color:${yoyDiff!==null&&yoyDiff>0?'var(--danger)':yoyDiff!==null?'var(--success)':'var(--muted)'}">${yoyDiff!==null?(yoyDiff>=0?'+':'')+yoyDiff.toFixed(1)+'%': '无数据'}</div>
    <div class="metric-sub">去年同月支出 ¥${fmt(lySpent)}</div>
  </div>
</div>
<div style="display:flex;gap:8px;margin-top:4px;flex-wrap:wrap;">
  <div style="flex:1;min-width:140px;background:${avgDaily>dailyLeft?'#fee2e2':'#f0fdf4'};padding:8px 12px;border-radius:8px;font-size:.8rem">
    ${avgDaily>dailyLeft ? '⚠️ 日均消费(¥'+fmt(avgDaily)+') > 剩余日均可用(¥'+fmt(dailyLeft)+')，需要省钱' : '✅ 消费节奏正常，日均 ¥'+fmt(avgDaily)+' ≤ 可用 ¥'+fmt(dailyLeft)}
  </div>
  <div style="flex:1;min-width:140px;background:#f8fafc;padding:8px 12px;border-radius:8px;font-size:.8rem">
    💰 本月收入 ¥${fmt(income)} | 结余 ¥${fmt(income-spent)}
  </div>
</div>`;
}

// ====== MOM COMPARISON ======
function renderMoM() {
  const body = document.getElementById('momBody');
  if (!body) return;
  const monthsSet = new Set(); data.transactions.forEach(t=>monthsSet.add(yyyymm(t.date)));
  const months = [...monthsSet].sort();
  if (months.length < 2) { body.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--muted)">需要至少两个月的数*才能对比</td></tr>'; return; }
  const thisM = months[months.length-1];
  const prevM = months[months.length-2];
  const expenseCats = getCatsByType('支出').map(c=>c.name);

  body.innerHTML = expenseCats.map(c=>{
    const curr = data.transactions.filter(t=>yyyymm(t.date)===thisM&&t.type==='支出'&&t.cat1===c).reduce((s,t)=>s+t.amount,0);
    const prev = data.transactions.filter(t=>yyyymm(t.date)===prevM&&t.type==='支出'&&t.cat1===c).reduce((s,t)=>s+t.amount,0);
    const diff = curr - prev;
    const pct = prev>0?((diff/prev)*100).toFixed(1):(curr>0?'new':'--');
    const arrow = diff>0?'📈':diff<0?'📉':'➡️';
    const clr = diff>0?'var(--danger)':diff<0?'var(--success)':'var(--muted)';
    return `<tr><td>${c}</td><td><span style="color:var(--muted)">¥${fmt(prev)}</span></td><td>¥${fmt(curr)}</td><td style="color:${clr};font-weight:600">${diff>=0?'+':''}¥${fmt(diff)} (${typeof pct==='string'?pct:(diff>=0?'+':'')+pct+'%'})</td><td>${arrow}</td></tr>`;
  }).join('');
}

// ====== INCOME DISTRIBUTION ======
function renderIncomeChart() {
  const ctx = document.getElementById('incomeChart')?.getContext('2d');
  if (!ctx) return;
  const incCats = getCatsByType('收入');
  const labels = incCats.map(c=>c.name);
  const values = incCats.map(c=>data.transactions.filter(t=>t.type==='收入'&&t.cat1===c.name).reduce((s,t)=>s+t.amount,0));
  if (incomeChart) incomeChart.destroy();
  incomeChart = new Chart(ctx, {
    type:'doughnut',
    data:{ labels, datasets:[{ data:values, backgroundColor:['#10b981','#3b82f6','#f59e0b','#8b5cf6','#ec4899','#64748b'] }] },
    options:{ responsive:true, maintainAspectRatio:true, plugins:{ legend:{ position:'bottom', labels:{ font:{size:11}, padding:12 } }, tooltip:{ callbacks:{ label:ctx=>ctx.label+': ¥'+fmt(ctx.raw) } } } }
  });
}

// ====== BILL REMINDERS ======
function renderBillReminders() {
  const el = document.getElementById('billReminders');
  if (!el) return;
  const bills = getBills();
  if (bills.length === 0) {
    el.innerHTML = '<div class="empty">暂无账单提醒，点击下方按钮添加（如信用卡还款日、房租）</div>';
    return;
  }
  const now = new Date();
  const today = now.toISOString().slice(0,10);

  el.innerHTML = '<div class="table-wrap"><table><thead><tr><th>账单</th><th>金额</th><th>到期日</th><th>状态</th><th>操作</th></tr></thead><tbody>'+bills.map((b,i)=>{
    const overdue = b.date < today;
    const soon = !overdue && b.date <= new Date(Date.now()+3*86400000).toISOString().slice(0,10);
    let status = overdue?'<span class="badge badge-over">已逾期</span>':soon?'<span class="badge badge-over">即将到期</span>':'<span class="badge badge-under">正常</span>';
    return `<tr style="${overdue?'background:#fef2f2':soon?'background:#fffbeb':''}"><td>${b.name}</td><td style="font-weight:600">¥${fmt(b.amount)}</td><td>${b.date}</td><td>${status}</td><td><button class="btn btn-danger btn-sm" onclick="deleteBill(${i})">✕</button></td></tr>`;
  }).join('')+'</tbody></table></div>';
}

function showBillModal() {
  const old = document.getElementById('billModal');
  if (old) old.remove();
  const m = document.createElement('div');
  m.id = 'billModal';
  m.className = 'modal-overlay';
  m.style.display = 'flex';
  m.onclick = function(e) { if(e.target===m) m.remove(); };
  m.innerHTML = `<div class="modal"><div class="modal-title">添加账单提醒</div>
    <div class="form-group"><label class="form-label">账单名称</label><input type="text" class="form-input" id="billName" placeholder="如：信用卡还款、房租"></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">金额</label><input type="number" class="form-input" id="billAmount" placeholder="0.00" step="0.01"></div>
      <div class="form-group"><label class="form-label">到期日</label><input type="date" class="form-input" id="billDate"></div>
    </div>
    <div class="btn-group" style="justify-content:flex-end;margin-top:16px;">
      <button class="btn btn-outline" onclick="document.getElementById('billModal').remove()">取消</button>
      <button class="btn btn-primary" onclick="addBill()">添加</button>
    </div></div>`;
  document.body.appendChild(m);
  document.getElementById('billDate').value = new Date().toISOString().slice(0,10);
}

async function addBill() {
  const name = document.getElementById('billName')?.value?.trim();
  const amount = parseFloat(document.getElementById('billAmount')?.value);
  const date = document.getElementById('billDate')?.value;
  if (!name || !date || isNaN(amount)) { showToast('请填写完整'); return; }
  getBills().push({ name, amount, date });
  await safeSave();
  document.getElementById('billModal')?.remove();
  renderBillReminders();
  showToast('✅ 账单提醒已添加');
}

async function deleteBill(idx) {
  getBills().splice(idx, 1);
  await safeSave();
  renderBillReminders();
}

// Update renderDashboard to call new functions
const _origDashboard = renderDashboard;
renderDashboard = function() {
  _origDashboard();
  renderDailyBudget();
  renderMoM();
  renderIncomeChart();
  renderBillReminders();
  renderYearlyAnalysis();
};

// ====== YEARLY ANALYSIS ======
function renderYearlyAnalysis() {
  const monthsSet = new Set(); data.transactions.forEach(t=>monthsSet.add(yyyymm(t.date)));
  const months = [...monthsSet].sort();
  if (months.length === 0) { return; }
  const years = [...new Set(months.map(m=>m.split('-')[0]))].sort();
  const sel = document.getElementById('yearlyYear');
  const curY = sel?.value || years[years.length-1] || '';
  if (sel) sel.innerHTML = years.map(y=>`<option value="${y}" ${y===curY?'selected':''}>${y}年</option>`).join('');
  const filterY = sel?.value || years[years.length-1] || new Date().getFullYear().toString();
  const yMonths = months.filter(m=>m.startsWith(filterY));
  const yTxs = data.transactions.filter(t=>yyyymm(t.date).startsWith(filterY));
  const totalBudget = getCatsByType('支出').reduce((s,c)=>s+c.budget,0);

  // Metrics
  const yIn = yTxs.filter(t=>t.type==='收入').reduce((s,t)=>s+t.amount,0);
  const yOut = yTxs.filter(t=>t.type==='支出').reduce((s,t)=>s+t.amount,0);
  const yBal = yIn - yOut;
  const ySavRate = yIn>0?((yIn-yOut)/yIn*100).toFixed(1):'0.0';
  const yBudget = totalBudget * yMonths.length;
  const yBudgetRate = yBudget>0?(yOut/yBudget*100).toFixed(1):'0.0';
  const monthsWithData = yMonths.filter(m=>data.transactions.some(t=>yyyymm(t.date)===m)).length;
  const avgMonthlyOut = monthsWithData>0?yOut/monthsWithData:0;

  const mEl = document.getElementById('yearlyMetrics');
  if (mEl) {
    mEl.innerHTML = `
<div class="metric income"><div class="metric-label">年度总收入</div><div class="metric-value">¥${fmt(yIn)}</div></div>
<div class="metric expense"><div class="metric-label">年度总支出</div><div class="metric-value">¥${fmt(yOut)}</div></div>
<div class="metric"><div class="metric-label">年度结余</div><div class="metric-value" style="color:${yBal>=0?'var(--success)':'var(--danger)'}">¥${fmt(yBal)}</div></div>
<div class="metric"><div class="metric-label">💎 储蓄率</div><div class="metric-value">${ySavRate}%</div><div class="metric-sub">月均支出 ¥${fmt(avgMonthlyOut)}</div></div>
<div class="metric"><div class="metric-label">预算执行率</div><div class="metric-value" style="color:${parseFloat(yBudgetRate)>100?'var(--danger)':'var(--success)'}">${yBudgetRate}%</div><div class="metric-sub">年度预算 ¥${fmt(yBudget)}</div></div>`;
  }

  // Yearly income pie chart
  const incCats = getCatsByType('收入');
  const incLabels = incCats.map(c=>c.name);
  const incValues = incCats.map(c=>yTxs.filter(t=>t.type==='收入'&&t.cat1===c.name).reduce((s,t)=>s+t.amount,0));
  const ctxIn = document.getElementById('yearlyIncomeChart')?.getContext('2d');
  if (ctxIn) {
    if (yearlyIncomeChart) yearlyIncomeChart.destroy();
    yearlyIncomeChart = new Chart(ctxIn, {
      type:'doughnut',
      data:{ labels:incLabels, datasets:[{ data:incValues, backgroundColor:['#10b981','#3b82f6','#f59e0b','#8b5cf6','#ec4899','#64748b'], borderWidth:0 }] },
      options:{ responsive:true, maintainAspectRatio:true, plugins:{ legend:{ position:'bottom', labels:{ padding:10, font:{size:9} } }, tooltip:{ callbacks:{ label:ctx=>ctx.label+': ¥'+fmt(ctx.raw) } } } }
    });
  }

  // Yearly expense pie chart
  const expCats = getCatsByType('支出');
  const expLabels = expCats.map(c=>c.name);
  const expValues = expCats.map(c=>yTxs.filter(t=>t.type==='支出'&&t.cat1===c.name).reduce((s,t)=>s+t.amount,0));
  const ctxExp = document.getElementById('yearlyExpenseChart')?.getContext('2d');
  if (ctxExp) {
    if (yearlyExpenseChart) yearlyExpenseChart.destroy();
    yearlyExpenseChart = new Chart(ctxExp, {
      type:'doughnut',
      data:{ labels:expLabels, datasets:[{ data:expValues, backgroundColor:['#ef4444','#f97316','#f59e0b','#84cc16','#10b981','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#f43f5e','#64748b'], borderWidth:0 }] },
      options:{ responsive:true, maintainAspectRatio:true, plugins:{ legend:{ position:'bottom', labels:{ padding:10, font:{size:9} } }, tooltip:{ callbacks:{ label:ctx=>ctx.label+': ¥'+fmt(ctx.raw) } } } }
    });
  }

  // Yearly detail table
  const dEl = document.getElementById('yearlyDetailBody');
  if (dEl) {
    let cumIn = 0, cumOut = 0;
    dEl.innerHTML = yMonths.map(m=>{
      const mIn = data.transactions.filter(t=>yyyymm(t.date)===m&&t.type==='收入').reduce((s,t)=>s+t.amount,0);
      const mOut = data.transactions.filter(t=>yyyymm(t.date)===m&&t.type==='支出').reduce((s,t)=>s+t.amount,0);
      const mBal = mIn - mOut;
      const mSR = mIn>0?((mIn-mOut)/mIn*100).toFixed(1):'--';
      const mBR = totalBudget>0?(mOut/totalBudget*100).toFixed(1):'0';
      const brClr = parseFloat(mBR)>100?'var(--danger)':parseFloat(mBR)>80?'var(--warning)':'var(--success)';
      const hasData = data.transactions.some(t=>yyyymm(t.date)===m);
      if (!hasData) return `<tr><td style="color:var(--muted)">${monthName(m)}</td><td colspan="5" style="color:var(--muted);text-align:center">暂无数据</td></tr>`;
      cumIn += mIn; cumOut += mOut;
      return `<tr><td><strong>${monthName(m)}</strong></td><td class="amount-pos">¥${fmt(mIn)}</td><td class="amount-neg">¥${fmt(mOut)}</td><td style="color:${mBal>=0?'var(--success)':'var(--danger)'};font-weight:600">¥${fmt(mBal)}</td><td>${mSR}%</td><td style="color:${brClr};font-weight:600">${mBR}%</td></tr>`;
    }).join('');
  }
}</script>
