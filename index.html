<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<base href="/personal-budget/">
<title>个人记账</title>
<style>
:root {
  --bg: #f5f6fa; --card: #fff; --text: #1e293b; --muted: #64748b;
  --primary: #3b82f6; --danger: #ef4444; --success: #10b981; --warning: #f59e0b;
  --border: #e2e8f0; --radius: 12px;
  --income: #10b981; --expense: #ef4444;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
.app { max-width:800px; margin:0 auto; padding:10px; }

.lock-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
.lock-card { background:var(--card); border-radius:var(--radius); box-shadow:0 4px 24px rgba(0,0,0,.08); padding:32px 24px; width:100%; max-width:360px; text-align:center; }
.lock-title { font-size:1.2rem; font-weight:700; margin-bottom:4px; }
.lock-sub { font-size:.85rem; color:var(--muted); margin-bottom:20px; }
.lock-input { width:100%; padding:12px; border:1.5px solid var(--border); border-radius:10px; font-size:1rem; text-align:center; letter-spacing:3px; }
.lock-btn { margin-top:14px; width:100%; padding:12px; border-radius:10px; border:none; background:var(--primary); color:#fff; font-size:1rem; font-weight:600; cursor:pointer; }

.header { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:var(--card); border-radius:var(--radius); box-shadow:0 1px 3px rgba(0,0,0,.06); margin-bottom:10px; flex-wrap:wrap; gap:6px; }
.header h1 { font-size:1.1rem; font-weight:700; }
.header-meta { font-size:.72rem; color:var(--muted); }

.tabs { display:flex; gap:3px; background:var(--card); border-radius:var(--radius); padding:3px; box-shadow:0 1px 3px rgba(0,0,0,.06); margin-bottom:10px; overflow-x:auto; }
.tab { flex:1 0 auto; text-align:center; padding:8px 10px; border-radius:8px; cursor:pointer; font-size:.78rem; font-weight:500; color:var(--muted); border:none; background:none; white-space:nowrap; }
.tab.active { background:var(--primary); color:#fff; }

.card { background:var(--card); border-radius:var(--radius); box-shadow:0 1px 3px rgba(0,0,0,.06); padding:14px; margin-bottom:10px; }
.card-title { font-size:.92rem; font-weight:700; margin-bottom:10px; }

.hero { background: linear-gradient(135deg, #eff6ff, #f0f4ff); padding:16px; border-radius:var(--radius); margin-bottom:10px; border:1.5px solid #bfdbfe; }
.hero-days { font-size:.78rem; color:var(--muted); }
.hero-amount { font-size:2rem; font-weight:700; color:#1e40af; margin:4px 0; }
.hero-sub { font-size:.78rem; color:var(--muted); }

.metrics { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
.metric { background:var(--card); border-radius:var(--radius); padding:10px 12px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
.metric-label { font-size:.72rem; color:var(--muted); }
.metric-value { font-size:1.05rem; font-weight:700; margin-top:2px; }
.metric-sub { font-size:.65rem; color:var(--muted); margin-top:2px; }
.income .metric-value { color:var(--income); }
.expense .metric-value { color:var(--expense); }

.table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
table { width:100%; border-collapse:collapse; font-size:.75rem; }
th { text-align:left; padding:6px 8px; background:var(--bg); font-weight:600; font-size:.72rem; color:var(--muted); border-bottom:2px solid var(--border); white-space:nowrap; }
td { padding:6px 8px; border-bottom:1px solid var(--border); font-size:.74rem; vertical-align:top; }
.amount-pos { color:var(--income); font-weight:600; }
.amount-neg { color:var(--expense); font-weight:600; }
.amount-refund { color:var(--success); font-weight:600; }

.btn { padding:7px 14px; border-radius:8px; border:none; font-size:.78rem; font-weight:500; cursor:pointer; touch-action:manipulation; }
.btn-primary { background:var(--primary); color:#fff; }
.btn-success { background:var(--success); color:#fff; }
.btn-danger { background:var(--danger); color:#fff; }
.btn-outline { background:none; border:1.5px solid var(--border); color:var(--text); }
.btn-sm { padding:3px 8px; font-size:.7rem; border-radius:5px; }
.btn-group { display:flex; gap:6px; flex-wrap:wrap; }

.form-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.form-group { margin-bottom:8px; }
.form-label { display:block; font-size:.75rem; font-weight:600; margin-bottom:3px; color:var(--muted); }
.form-input, .form-select { width:100%; padding:7px 9px; border:1.5px solid var(--border); border-radius:7px; font-size:.82rem; background:var(--card); }
.form-input:focus, .form-select:focus { outline:none; border-color:var(--primary); }
.form-input.amount-input { font-size:1.3rem; font-weight:700; text-align:center; padding:10px; }
.form-check { display:flex; align-items:center; gap:4px; font-size:.75rem; color:var(--muted); margin-top:4px; }
.form-check input[type=checkbox] { width:16px; height:16px; }

.badge { display:inline-block; padding:2px 6px; border-radius:8px; font-size:.68rem; font-weight:600; }
.badge-income { background:#d1fae5; color:#065f46; }
.badge-expense { background:#fee2e2; color:#991b1b; }
.badge-transfer { background:#e0e7ff; color:#3730a3; }
.badge-refund { background:#d1fae5; color:#065f46; }
.badge-fixed { background:#fef3c7; color:#92400e; }
.badge-reimburse { background:#ede9fe; color:#5b21b6; }
.badge-over { background:#fef3c7; color:#92400e; }
.badge-under { background:#d1fae5; color:#065f46; }

.row-actions { display:flex; gap:3px; flex-wrap:wrap; }
.empty { text-align:center; padding:30px 16px; color:var(--muted); font-size:.8rem; }

.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#1e293b; color:#fff; padding:8px 20px; border-radius:20px; font-size:.8rem; z-index:200; opacity:0; transition:opacity .3s; pointer-events:none; }
.toast.show { opacity:1; }

.template-chips { display:flex; gap:6px; flex-wrap:wrap; padding:4px 0; }
.template-chip { background:var(--bg); border:1.5px solid var(--border); border-radius:20px; padding:5px 12px; font-size:.73rem; cursor:pointer; white-space:nowrap; color:var(--text); }
.template-chip:active { background:var(--primary); color:#fff; border-color:var(--primary); }

details { margin-top:4px; }
details summary { font-size:.85rem; font-weight:600; color:var(--muted); cursor:pointer; padding:6px 0; user-select:none; }
details[open] summary { margin-bottom:8px; }
</style>
</head>
<body>
<div id="app-root"></div>
<div class="toast" id="toast"></div>

<script>
var dd = { categories:[], transactions:[], bills:[], templates:[], lastCat:'', lastSrc:'', initialBalances:{}, budgetCycleDay:1, budgetRollover:false, creditBillDay:26, creditDueDay:14 };
var pp = '';
var TMPL_DEFAULTS = [
  {cat1:'餐饮',cat2:'三餐',amount:25,label:'早餐'},
  {cat1:'交通',cat2:'公共交通',amount:5,label:'地铁'},
  {cat1:'娱乐',cat2:'电影',amount:50,label:'电影'},
  {cat1:'餐饮',cat2:'外卖',amount:35,label:'外卖'}
];

var CR = {
  _e:function(s){return new TextEncoder().encode(s)},
  _d:function(b){return new TextDecoder().decode(b)},
  _h:function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')},
  _u:function(h){return new Uint8Array(h.match(/.{1,2}/g).map(function(b){return parseInt(b,16)})).buffer},
  async _k(p,s){var b=await crypto.subtle.importKey('raw',this._e(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:200000,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);},
  async enc(txt,pass){var s=crypto.getRandomValues(new Uint8Array(16)),i=crypto.getRandomValues(new Uint8Array(12)),k=await this._k(pass,s),c=await crypto.subtle.encrypt({name:'AES-GCM',iv:i},k,this._e(txt));return JSON.stringify({s:this._h(s),i:this._h(i),c:this._h(c)});},
  async dec(ct,pass){try{var o=JSON.parse(ct),s=new Uint8Array(this._u(o.s)),i=new Uint8Array(this._u(o.i)),ct2=new Uint8Array(this._u(o.c)),k=await this._k(pass,s);return this._d(await crypto.subtle.decrypt({name:'AES-GCM',iv:i},k,ct2));}catch(e){return null;}},
  async hash(p){var h=await crypto.subtle.digest('SHA-256',this._e('pc:'+p));return this._h(h);}
};

var SK = {ph:'bp_ph3',de:'bp_de3'};
var CREDIT_SOURCES = ['信用卡','白条'];

function t(msg){ var e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(function(){e.classList.remove('show')},2000); }
function f(n){ return Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function mm(d){ var dt=new Date(d);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'); }
function mn(m){ var p=m.split('-');return p[0]+'年'+p[1]+'月'; }
function aEl(id){ return document.getElementById(id); }

var IDD = {
  creditBillDay:26, creditDueDay:14,
  categories:[
    {type:'支出',name:'餐饮',budget:2000,subs:['三餐','食材','外卖','聚餐','零食饮料'],budgetType:'flex'},
    {type:'支出',name:'交通',budget:1500,subs:['公共交通','加油','停车过路','保养维修','保险'],budgetType:'flex'},
    {type:'支出',name:'购物',budget:2000,subs:['线上购物','线下超市','数码','服饰','家居日用','日用杂货'],budgetType:'flex'},
    {type:'支出',name:'居住',budget:3000,subs:['固定账单','维修更换'],budgetType:'rigid'},
    {type:'支出',name:'育儿',budget:1000,subs:['日常消耗','大件','教育'],budgetType:'flex'},
    {type:'支出',name:'医疗',budget:500,subs:['门诊','药品','住院','生育'],budgetType:'flex'},
    {type:'支出',name:'娱乐',budget:800,subs:['运动','游戏','电影','会员订阅','其他'],budgetType:'flex'},
    {type:'支出',name:'人情',budget:1000,subs:['礼金','红包','礼物'],budgetType:'flex'},
    {type:'支出',name:'个人护理',budget:200,subs:['美容','理发'],budgetType:'flex'},
    {type:'支出',name:'通讯',budget:200,subs:[],budgetType:'rigid'},
    {type:'支出',name:'保险',budget:0,subs:[],budgetType:'rigid'},
    {type:'支出',name:'贷款',budget:0,subs:[],budgetType:'rigid'},
    {type:'收入',name:'工资',budget:0,subs:[]},{type:'收入',name:'报销款',budget:0,subs:[]},
    {type:'收入',name:'理财收益',budget:0,subs:[]},{type:'收入',name:'赠礼收入',budget:0,subs:[]},
    {type:'收入',name:'其他收入',budget:0,subs:[]},
    {type:'转账',name:'借入',budget:0,subs:[]},{type:'转账',name:'借出',budget:0,subs:[]},
    {type:'转账',name:'还款',budget:0,subs:[]},{type:'转账',name:'信用还款',budget:0,subs:[]}
  ],
  transactions:[],bills:[],templates:TMPL_DEFAULTS,lastCat:'',lastSrc:'',
  initialBalances:{信用卡:0,储蓄卡:0,现金:0},budgetCycleDay:1,budgetRollover:false
};

function gcs(t){ return dd.categories.filter(function(c){return c.type===t}); }
function gcc(n){ return dd.categories.find(function(c){return c.name===n}); }
function getBudgetByType(bt){ return gcs('支出').filter(function(c){return c.budgetType===bt}).reduce(function(s,c){return s+c.budget},0); }
function ensureBudgetTypes(){(dd.categories||[]).forEach(function(c){if(c.type==='支出'&&!c.budgetType)c.budgetType=('居住|通讯|保险|贷款'.indexOf(c.name)>=0?'rigid':'flex');});}

function migrateTx(tx){
  if(!tx.fundSource){var pm=tx.pay||tx.paymentMethod||'';if(/信用卡/.test(pm)){tx.fundSource='信用卡';tx.channel='刷卡';}else if(/白条/.test(pm)){tx.fundSource='白条';tx.channel='在线';}else{tx.fundSource='储蓄卡';tx.channel=pm||'其他';}}
  if(!tx.channel)tx.channel='其他';
  if(tx.reimbursable===undefined)tx.reimbursable=false;
  if(tx.reimbursed===undefined)tx.reimbursed=false;
  if(tx.isFixed===undefined)tx.isFixed=false;
  if(!tx.pay||tx.pay===(tx.fundSource||'')+'·'+(tx.channel||''))tx.pay=(tx.fundSource||'储蓄卡')+'·'+(tx.channel||'其他');
  return tx;
}

async function sv(){
  localStorage.setItem(SK.de,await CR.enc(JSON.stringify({
    categories:dd.categories,transactions:dd.transactions,bills:dd.bills||[],
    templates:dd.templates||[],lastCat:dd.lastCat||'',lastSrc:dd.lastSrc||'',
    initialBalances:dd.initialBalances||{信用卡:0,储蓄卡:0,现金:0},
    budgetCycleDay:dd.budgetCycleDay||1,budgetRollover:!!dd.budgetRollover
  }),pp));
}
async function ld(){
  var e=localStorage.getItem(SK.de);if(!e){dd=JSON.parse(JSON.stringify(IDD));ensureBudgetTypes();return;}
  var j=await CR.dec(e,pp);
  if(j){try{var parsed=JSON.parse(j);dd.categories=parsed.categories||JSON.parse(JSON.stringify(IDD.categories));dd.transactions=(parsed.transactions||[]).map(migrateTx);dd.bills=parsed.bills||[];dd.templates=parsed.templates||TMPL_DEFAULTS;dd.lastCat=parsed.lastCat||'';dd.lastSrc=parsed.lastSrc||'';dd.initialBalances=parsed.initialBalances||{信用卡:0,储蓄卡:0,现金:0};dd.budgetCycleDay=parsed.budgetCycleDay||1;dd.budgetRollover=!!parsed.budgetRollover;ensureBudgetTypes();}catch(e2){dd=JSON.parse(JSON.stringify(IDD));ensureBudgetTypes();}}
  else{dd=JSON.parse(JSON.stringify(IDD));ensureBudgetTypes();t('解密失败');}
}
function fv(){ return !localStorage.getItem(SK.ph); }
async function sp(p){ localStorage.setItem(SK.ph,await CR.hash(p));pp=p; }
async function cp(p){ if(!localStorage.getItem(SK.ph))return true;return (await CR.hash(p))===localStorage.getItem(SK.ph); }
function lo(){ pp='';dd=JSON.parse(JSON.stringify(IDD));rL(); }

function actualExpense(txs){var total=0,pending=0;txs.forEach(function(t){if(t.type==='支出'){total+=t.amount;if(t.reimbursable&&!t.reimbursed)pending+=t.amount;}});return {total:total,actual:total-pending,pending:pending};}
function calcNetWorth(){var ib=dd.initialBalances||{信用卡:0,储蓄卡:0,现金:0};var allIn=dd.transactions.filter(function(t){return t.type==='收入'}).reduce(function(s,t){return s+t.amount},0);var allOut=0;dd.transactions.forEach(function(t){if(t.type==='支出'&&!(t.reimbursable&&!t.reimbursed))allOut+=t.amount;});return ib.信用卡+ib.储蓄卡+ib.现金+allIn-allOut;}

function rL(){
  var isNew=fv();
  document.getElementById('app-root').innerHTML='<div class="lock-screen"><div class="lock-card"><div class="lock-title">'+(isNew?'设置密码':'个人记账')+'</div><div class="lock-sub">'+(isNew?'设置密码来保护账本数据':'输入密码进入')+'</div><input type="password" class="lock-input" id="lp" placeholder="••••••" maxlength="32" autocomplete="off"><button class="lock-btn" id="lb">'+(isNew?'设置密码并进入':'进入')+'</button><div style="margin-top:8px;font-size:.75rem;color:var(--danger)" id="le"></div><div style="margin-top:12px;font-size:.72rem;color:var(--muted)">'+(isNew?'密码用于加密存储，忘记则数据无法恢复':'')+'</div></div></div>';
  var i=document.getElementById('lp'),b=document.getElementById('lb'),er=document.getElementById('le');
  async function go(){var p=i.value.trim();if(!p||p.length<4){er.textContent='密码至少4位';return;}if(isNew){await sp(p);dd=JSON.parse(JSON.stringify(IDD));ensureBudgetTypes();await sv();rA();}else{var ok=await cp(p);if(!ok){er.textContent='密码错误';return;}pp=p;await ld();rA();}}
  b.addEventListener('click',go);
  i.addEventListener('keypress',function(e){if(e.key==='Enter')go();});
  i.focus();
}

function rA(){
  var tin=dd.transactions.filter(function(t){return t.type==='收入'}).reduce(function(s,t){return s+t.amount},0);
  var nw=calcNetWorth();
  var appHTML='<div class="app">';
  appHTML+='<div class="header"><div><h1>个人记账</h1><div class="header-meta">加密 · '+dd.transactions.length+'条 · 净资产 '+f(nw)+'</div></div>';
  appHTML+='<div class="btn-group"><button class="btn btn-outline btn-sm" onclick="exe()">导出</button><button class="btn btn-outline btn-sm" onclick="imi()">导入</button><button class="btn btn-outline btn-sm" onclick="lo()">锁定</button></div></div>';
  appHTML+='<div class="tabs"><button class="tab active" onclick="st(\'tx\')">流水</button><button class="tab" onclick="st(\'an\')">分析</button><button class="tab" onclick="st(\'st\')">设置</button></div>';
  
  // Tab: 流水
  appHTML+='<div id="tab-tx">';
  appHTML+='<div class="metrics"><div class="metric income"><div class="metric-label">累计收入</div><div class="metric-value">'+f(tin)+'</div></div><div class="metric expense"><div class="metric-label">累计支出</div><div class="metric-value">'+f(dd.transactions.filter(function(t){return t.type==='支出'}).reduce(function(s,t){return s+t.amount},0))+'</div></div><div class="metric"><div class="metric-label">净资产</div><div class="metric-value" style="color:'+(nw>=0?'var(--success)':'var(--danger)')+'">'+f(nw)+'</div></div><div class="metric"><div class="metric-label">记录数</div><div class="metric-value">'+dd.transactions.length+'</div></div></div>';
  
  appHTML+='<div class="card"><div class="card-title">记一笔</div><div class="form-row">';
  appHTML+='<div class="form-group"><div class="form-label">日期</div><input type="date" class="form-input" id="td" value="'+new Date().toISOString().slice(0,10)+'"></div>';
  appHTML+='<div class="form-group"><div class="form-label">类型</div><select class="form-select" id="tt" onchange="rcc()"><option>支出</option><option>收入</option><option>转账</option></select></div>';
  appHTML+='<div class="form-group"><div class="form-label">分类</div><select class="form-select" id="tc1" onchange="rcc2()"></select></div>';
  appHTML+='<div class="form-group"><div class="form-label">二级分类</div><select class="form-select" id="tc2"></select></div>';
  appHTML+='<div class="form-group"><div class="form-label">资金来源</div><select class="form-select" id="fs"><option value="储蓄卡">储蓄卡</option><option value="信用卡">信用卡</option><option value="现金">现金</option></select></div>';
  appHTML+='<div class="form-group"><div class="form-label">支付渠道</div><select class="form-select" id="ch"><option value="微信">微信</option><option value="支付宝">支付宝</option><option value="刷卡">刷卡</option><option value="现金">现金</option><option value="网银">网银</option></select></div>';
  appHTML+='<div class="form-group"><div class="form-label">金额</div><input type="number" class="form-input amount-input" id="ta" placeholder="0.00" step="0.01" inputmode="decimal"></div>';
  appHTML+='</div><div class="form-row" style="margin-top:4px"><label class="form-check"><input type="checkbox" id="ir" onchange="rcs()"> 可报销</label><label class="form-check"><input type="checkbox" id="ifx"> 固定支出</label><label class="form-check" id="lblRefund" style="display:none"><input type="checkbox" id="isRefund"> 退款</label></div>';
  appHTML+='<div class="form-group"><div class="form-label">备注</div><input type="text" class="form-input" id="tn" placeholder="可选"></div>';
  appHTML+='<div style="margin:6px 0;font-size:.73rem;color:var(--muted);font-weight:600">快速模板</div><div class="template-chips" id="tplChips"></div>';
  appHTML+='<div class="btn-group" style="margin-top:10px"><button class="btn btn-primary" onclick="atx(false)">保存并继续</button><button class="btn btn-success" onclick="atx(true)">保存并看分析</button></div><span style="margin-left:10px;font-size:.75rem;color:var(--muted)" id="eh"></span></div>';
  appHTML+='<div class="card"><div class="card-title" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px"><span>交易记录</span><input type="text" class="form-input" id="txSearch" placeholder="搜索..." style="width:120px;font-size:.75rem;padding:4px 8px" oninput="rtb()"><select class="form-select" style="width:auto;font-size:.75rem;padding:4px 8px" id="fm" onchange="rtb()"><option value="">全部月份</option></select></div><div class="table-wrap"><table><thead><tr><th>日期</th><th>类型</th><th>分类</th><th>金额</th><th>资金·渠道</th><th>标签</th><th>操作</th></tr></thead><tbody id="tb"></tbody></table></div><div class="empty" id="te"></div></div>';
  appHTML+='</div>';
  
  // Tab: 分析
  appHTML+='<div id="tab-an" style="display:none"><div id="heroSection"></div><div class="metrics" id="am"></div>';
  appHTML+='<div class="card"><div class="card-title">月度汇总</div><div class="table-wrap"><table><thead><tr><th>月份</th><th>收入</th><th>实际支出</th><th>结余</th><th>待报销</th><th>预算</th></tr></thead><tbody id="asb"></tbody></table></div></div>';
